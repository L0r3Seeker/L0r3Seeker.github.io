<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>牛子长度计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-elevated: #f5f5f7;
            --surface-card: #ffffff;
            --surface-soft: #f9f9fb;
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #8e8e93;
            --border-subtle: rgba(0, 0, 0, 0.05);
            --accent-dark: #2c2c2e;
            --accent-hover: #3a3a3c;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02), 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
            --transition-smooth: all 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --error-color: #ff3b30;
            --warning-color: #ff9500;
        }

        body.dark-mode {
            --bg-primary: #0a0a0c;
            --bg-elevated: #1c1c1e;
            --surface-card: #1c1c1e;
            --surface-soft: #2c2c2e;
            --text-main: #f5f5f7;
            --text-secondary: #aeaeb2;
            --text-tertiary: #8e8e93;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-dark: #3a3a3c;
            --accent-hover: #4a4a4c;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.3);
            --error-color: #ff453a;
            --warning-color: #ff9f0a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            transition: background 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 540px;
            width: 100%;
            background: var(--surface-card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 32px 28px;
            transition: var(--transition-smooth);
            border: 0.5px solid var(--border-subtle);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--text-main);
            font-size: 1.9rem;
            font-weight: 590;
            letter-spacing: -0.3px;
            margin: 0;
        }

        .mode-toggle {
            background: var(--surface-soft);
            border: 0.5px solid var(--border-subtle);
            border-radius: 40px;
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .mode-toggle:hover {
            transform: scale(0.94);
            background: var(--bg-elevated);
        }

        .input-group {
            margin-bottom: 28px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 450;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            outline: none;
            transition: var(--transition-smooth);
            color: var(--text-main);
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--text-secondary);
            background: var(--surface-card);
            box-shadow: 0 0 0 3px rgba(110, 110, 115, 0.08);
        }

        input[type="text"].error-input {
            border-color: var(--error-color);
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1);
        }

        .error-message {
            font-size: 0.78rem;
            color: var(--error-color);
            margin-top: 8px;
            margin-left: 12px;
            font-weight: 470;
            min-height: 22px;
        }

        .result-container {
            margin: 28px 0;
            padding: 28px 20px;
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            transition: var(--transition-smooth);
            text-align: center;
            border: 0.5px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-container.rainbow {
            animation: rainbow 3s ease infinite;
            background-size: 400% 400%;
            border: none;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; background: linear-gradient(135deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff); }
            25% { background-position: 50% 50%; background: linear-gradient(135deg, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000); }
            50% { background-position: 100% 50%; background: linear-gradient(135deg, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000, #ff7f00); }
            75% { background-position: 50% 50%; background: linear-gradient(135deg, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000, #ff7f00, #ffff00); }
            100% { background-position: 0% 50%; background: linear-gradient(135deg, #0000ff, #4b0082, #8f00ff, #ff0000, #ff7f00, #ffff00, #00ff00); }
        }

        .result-number {
            font-size: 3.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .result-comment {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.4;
        }

        .placeholder-text {
            color: var(--text-tertiary);
            font-size: 1.1rem;
        }

        .result-container.rainbow .result-number,
        .result-container.rainbow .result-comment {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .result-container.forbidden-result {
            background: var(--surface-soft);
            border: 1px solid var(--warning-color);
        }

        .result-container.forbidden-result .result-number {
            color: var(--warning-color);
        }

        button {
            background: var(--accent-dark);
            border: none;
            padding: 14px 28px;
            border-radius: 44px;
            font-size: 0.96rem;
            font-weight: 520;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            width: 100%;
            color: white;
            margin-bottom: 32px;
            letter-spacing: -0.2px;
        }

        button:hover {
            transform: scale(0.98);
            background: var(--accent-hover);
        }

        .rank-section {
            border-top: 0.5px solid var(--border-subtle);
            padding-top: 28px;
        }

        .rank-title {
            color: var(--text-main);
            font-size: 1.4rem;
            font-weight: 590;
            letter-spacing: -0.3px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        .rank-list {
            background: var(--surface-soft);
            border-radius: var(--radius-md);
            padding: 8px 4px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--border-subtle);
            transition: background 0.15s ease;
            border-radius: var(--radius-sm);
            margin: 2px 0;
        }

        .rank-item:last-child {
            border-bottom: none;
        }

        .rank-item:hover {
            background: var(--bg-elevated);
        }

        .rank-medal {
            font-size: 1.1rem;
            min-width: 42px;
            font-weight: 500;
        }

        .rank-name {
            flex: 1;
            font-weight: 480;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .rank-value {
            font-weight: 590;
            color: var(--text-main);
            background: var(--bg-primary);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.82rem;
        }

        .rank-empty {
            text-align: center;
            color: var(--text-tertiary);
            padding: 28px 12px;
            font-size: 0.9rem;
            font-weight: 450;
        }

        .clear-rank {
            background: transparent;
            border: 0.5px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 7px 18px;
            font-size: 0.78rem;
            font-weight: 480;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: auto;
            margin: 0;
        }

        .clear-rank:hover {
            background: var(--surface-soft);
            color: var(--text-main);
            transform: scale(0.96);
        }

        @keyframes softFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: softFadeIn 0.32s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @media (max-width: 520px) {
            .container {
                padding: 24px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .result-number {
                font-size: 2.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐂 牛子长度计算器</h1>
            <button class="mode-toggle" onclick="toggleDarkMode()" id="modeToggle">🌙</button>
        </div>
        
        <div class="input-group">
            <input 
                type="text" 
                id="username" 
                placeholder="请输入用户名"
                maxlength="20"
            >
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="placeholder-text">等待输入...</div>
        </div>

        <button onclick="calculate()">🎲 重新计算</button>

        <div class="rank-section">
            <div class="rank-title">
                🏆 牛子排行榜
                <button class="clear-rank" onclick="clearRank()">清除榜单</button>
            </div>
            <div class="rank-list" id="rankList">
                <div class="rank-empty">暂无数据，快来刷新记录！</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 违禁词配置区 ====================
        // 在这里添加/删除/修改违禁词，支持中英文，数量不限
        // 注意：匹配时不区分大小写，例如 "admin" 会匹配 "Admin"、"ADMIN" 等
        const forbiddenWords = [
            "习近平",
            "邓小平",
            "胡锦涛",
            "江泽民",
            "毛泽东",
            "周恩来",
            "林彪",
            "王洪文",
            "Admin"
        ];
        // ====================================================

        // 违禁词检测函数（不区分大小写）
        function isForbiddenUsername(username) {
            if (!username) return false;
            const lowerUsername = username.toLowerCase();
            return forbiddenWords.some(word => {
                return lowerUsername.includes(word.toLowerCase());
            });
        }

        // 获取违禁提示语（随机返回一条，增加趣味性）
        function getForbiddenMessage() {
            const messages = [
                "🚫 该用户名包含违禁词，无法查询",
                "⚠️ 检测到敏感词汇，请更换用户名",
                "🔞 此名称不符合查询规则，已被拦截",
                "❌ 违禁词触发，查询失败",
                "🙅 该用户名已被加入黑名单"
            ];
            return messages[Math.floor(Math.random() * messages.length)];
        }

        function toggleDarkMode() {
            const body = document.body;
            const modeToggle = document.getElementById('modeToggle');
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                modeToggle.textContent = '☀️';
                localStorage.setItem('darkMode', 'enabled');
            } else {
                modeToggle.textContent = '🌙';
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        function loadDarkMode() {
            const darkMode = localStorage.getItem('darkMode');
            if (darkMode === 'enabled') {
                document.body.classList.add('dark-mode');
                document.getElementById('modeToggle').textContent = '☀️';
            }
        }

        function vibrate() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }

        let rankData = [];

        function loadRank() {
            const saved = localStorage.getItem('rankData');
            if (saved) {
                rankData = JSON.parse(saved);
            }
        }

        function saveRank() {
            localStorage.setItem('rankData', JSON.stringify(rankData));
        }

        function displayRank() {
            const rankList = document.getElementById('rankList');
            
            if (rankData.length === 0) {
                rankList.innerHTML = '<div class="rank-empty">暂无数据，快来刷新记录！</div>';
                return;
            }

            const sorted = [...rankData].sort((a, b) => b.value - a.value).slice(0, 10);

            rankList.innerHTML = sorted.map((item, index) => {
                let medal = '';
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';
                else medal = `${index + 1}.`;

                let displayValue = item.value;
                if (item.value === Infinity || item.value === 999999) {
                    displayValue = '∞';
                }

                return `
                    <div class="rank-item">
                        <span class="rank-medal">${medal}</span>
                        <span class="rank-name">${escapeHtml(item.name)}</span>
                        <span class="rank-value">${displayValue} cm</span>
                    </div>
                `;
            }).join('');
        }

        function addToRank(name, value) {
            const existingIndex = rankData.findIndex(item => item.name === name);
            
            if (existingIndex !== -1) {
                if (value > rankData[existingIndex].value) {
                    rankData[existingIndex].value = value;
                }
            } else {
                rankData.push({ name, value });
            }

            if (rankData.length > 100) {
                rankData = rankData.slice(-100);
            }

            saveRank();
            displayRank();
        }

        function clearRank() {
            if (confirm('确定要清除所有排行榜数据吗？')) {
                rankData = [];
                saveRank();
                displayRank();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function getComment(value, isInfinite) {
            if (isInfinite) {
                return "✨ 超越维度的存在，宇宙为之震颤 ✨";
            }
            if (value <= 20) {
                return "进化树在你这里长了回头枝";
            } else if (value <= 150) {
                return "《自然》杂志拒绝发表：样本量不足。";
            } else if (value <= 500) {
                return "NASA已发出邀请：我们需要你的天线。";
            } else if (value <= 800) {
                return "三体人发来贺电：地球人终于有拿得出手的东西了";
            } else {
                return "建议捐给国家，用于建造跨海大桥";
            }
        }

        function calculate() {
            const username = document.getElementById('username').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            const usernameInput = document.getElementById('username');

            errorMessage.textContent = '';
            usernameInput.classList.remove('error-input');

            if (!username) {
                errorMessage.textContent = '⚠️ 请输入用户名';
                usernameInput.classList.add('error-input');
                return;
            }

            // ========== 违禁词检测 ==========
            if (isForbiddenUsername(username)) {
                errorMessage.textContent = getForbiddenMessage();
                usernameInput.classList.add('error-input');
                
                // 显示违禁提示结果卡片
                resultContainer.classList.remove('animate', 'rainbow');
                void resultContainer.offsetWidth;
                resultContainer.classList.add('animate');
                resultContainer.classList.add('forbidden-result');
                resultContainer.innerHTML = `
                    <div class="result-number" style="font-size: 2rem;">🚫</div>
                    <div class="result-comment">用户名包含敏感词，无法进行查询</div>
                `;
                return;
            }
            // =================================

            resultContainer.classList.remove('forbidden-result');

            let randomValue;
            let isSpecial = false;
            let specialComment = "";

            if (username === "L0r3Seeker" || username === "撸大师") {
                isSpecial = true;
                randomValue = Infinity;
                specialComment = "✨ 超越维度的存在，宇宙为之震颤 ✨";
            } else {
                const userHash = hashString(username);
                const timestamp = Date.now();
                const seed = userHash + timestamp;
                randomValue = Math.floor(seededRandom(seed) * 1001);
            }

            let comment;
            if (isSpecial) {
                comment = specialComment;
            } else {
                comment = getComment(randomValue, false);
            }

            resultContainer.classList.remove('animate');
            void resultContainer.offsetWidth;
            resultContainer.classList.add('animate');

            if (isSpecial) {
                resultContainer.classList.add('rainbow');
                vibrate();
            } else if (randomValue > 800) {
                resultContainer.classList.add('rainbow');
                vibrate();
            } else {
                resultContainer.classList.remove('rainbow');
            }

            if (isSpecial) {
                resultContainer.innerHTML = `
                    <div class="result-number">∞ cm</div>
                    <div class="result-comment">${comment}</div>
                `;
                addToRank(username, 999999);
            } else {
                resultContainer.innerHTML = `
                    <div class="result-number">${randomValue} cm</div>
                    <div class="result-comment">${comment}</div>
                `;
                addToRank(username, randomValue);
            }
        }

        loadDarkMode();
        loadRank();
        displayRank();

        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });

        // 输入时清除错误样式
        document.getElementById('username').addEventListener('input', function() {
            this.classList.remove('error-input');
            document.getElementById('errorMessage').textContent = '';
            const resultContainer = document.getElementById('resultContainer');
            if (resultContainer.classList.contains('forbidden-result')) {
                resultContainer.classList.remove('forbidden-result');
                resultContainer.innerHTML = '<div class="placeholder-text">等待输入...</div>';
                resultContainer.classList.remove('rainbow');
            }
        });
    </script>
</body>
</html>
